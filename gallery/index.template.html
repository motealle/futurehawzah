<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>سامانه تعاملی کلان‌روندهای جهانی مرتبط با حوزه آینده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#10141b;--panel2:#141a23;--line:#242c38;--text:#f5f7fb;--muted:#98a2b3;--glow:rgba(130,160,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,Arial,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;background:
radial-gradient(circle at 50% -15%,rgba(86,106,170,.18),transparent 34rem),
linear-gradient(180deg,#090c12 0%,#07090d 56%,#05070a 100%)}
main{width:min(100%,620px);padding:max(54px,8vh) 18px max(48px,env(safe-area-inset-bottom))}
header{text-align:center;margin:0 auto 34px}
h1{margin:0;font-size:clamp(26px,6vw,40px);line-height:1.5;font-weight:700;letter-spacing:-.025em}
h1 span{display:block}
nav{display:flex;flex-direction:column;gap:13px}
a.version{width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);
background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;
font-size:21px;font-weight:600;letter-spacing:.02em;box-shadow:0 10px 28px rgba(0,0,0,.18);transition:.16s ease}
a.version:hover{transform:translateY(-1px);border-color:#3b4658;box-shadow:0 14px 34px rgba(0,0,0,.28),0 0 0 4px var(--glow)}
a.version:active{transform:translateY(0) scale(.995)}
a.version.live{border-color:#485878;background:linear-gradient(180deg,#182132,#111824);box-shadow:0 12px 34px rgba(0,0,0,.24),0 0 30px rgba(91,124,205,.09)}
@media(max-width:520px){main{padding-left:14px;padding-right:14px}header{margin-bottom:28px}a.version{min-height:64px;border-radius:16px;font-size:20px}}
@media(prefers-reduced-motion:reduce){a.version{transition:none}}
</style>
</head>
<body>
<main>
<header>
<h1><span>سامانه تعاملی کلان‌روندهای جهانی</span><span>مرتبط با حوزه آینده</span></h1>
</header>
<nav aria-label="فهرست نسخه‌ها">
<!-- VERSION_BUTTONS -->
</nav>
</main>
</body>
</html>
