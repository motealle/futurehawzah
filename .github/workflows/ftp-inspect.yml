name: FTP inspect root

on:
  push:
    paths:
      - ".github/workflows/ftp-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Inspect FTP root read-only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME_FUTUREHAWZAH_IR }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_FUTUREHAWZAH_IR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set net:max-retries 1;
            set net:timeout 15;
            set ftp:ssl-allow yes;
            cd .;
            echo '--- REMOTE ROOT ---';
            cls -la;
            bye
          "
