name: FTP smoke test

on:
  push:
    paths:
      - ".github/workflows/ftp-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Verify FTP login (read-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME_FUTUREHAWZAH_IR }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_FUTUREHAWZAH_IR }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set net:max-retries 1;
            set net:timeout 15;
            set ftp:ssl-allow yes;
            pwd;
            bye
          "
          echo "FTP smoke test passed."
