name: Publish Future Hawzah portal

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portal.css"
      - "2d/**"
      - "3d/**"
      - "deployment/**"
      - "scripts/build-t-gallery.sh"
      - "gallery/**"
      - "fsinfo-static/**"
      - ".github/workflows/ftp-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futurehawzah-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release and prepare print downloads
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node --check 2d/t/06/atlas.js
          node --check 2d/t/07/atlas.js
          node --check fsinfo-static/v0.15/app.js
          node --check fsinfo-static/v0.18/app.js
          node --check 2d/t/09/atlas.js
          php -l 3d/review/account.php
          diff -u 2d/index.html <(sed 's|https://futurehawzah.ir/2d/t/09/|https://futurehawzah.ir/2d/|' 2d/t/09/index.html)
          diff -u 3d/index.html <(sed -E 's#(src|href)="(v0\.[0-9]+/)#\1="/3d/t/18/\2#g' fsinfo-static/index-v0.18-atlas.html)
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if git diff --name-only --diff-filter=DMRT "$BEFORE" HEAD -- 2d | grep -E '^2d/([0-9]+|t/[0-9]+)/'; then
              echo 'Numbered 2D releases are immutable.'
              exit 1
            fi
          fi
          python3 deployment/prepare-exhibition.py _release/downloads
          bash scripts/build-t-gallery.sh _release/3d-tests
          cp 3d/t/index.html _release/3d-tests/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Upload and verify by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME_FUTUREHAWZAH_IR }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_FUTUREHAWZAH_IR }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 24;
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            cd .;
            mkdir -p downloads/exhibition 2d/content 2d/t/06 2d/t/07 2d/t/08 2d/t/09 3d/review 3d/v0.9 3d/t;
            mirror -R --parallel=4 _release/downloads downloads/exhibition;
            mirror -R --parallel=4 2d/content 2d/content;
            mirror -R --parallel=4 2d/t/06 2d/t/06;
            mirror -R --parallel=4 2d/t/07 2d/t/07;
            mirror -R --parallel=4 2d/t/08 2d/t/08;
            mirror -R --parallel=4 2d/t/09 2d/t/09;
            mirror -R --parallel=4 3d/review 3d/review;
            mirror -R --parallel=4 fsinfo-static/v0.9 3d/v0.9;
            mirror -R --parallel=4 _release/3d-tests 3d/t;
            put portal.css -o portal.css;
            put 3d/index.html -o 3d/index.pending.html;
            mv 3d/index.pending.html 3d/index.html;
            put 2d/t/index.html -o 2d/t/index.pending.html;
            mv 2d/t/index.pending.html 2d/t/index.html;
            put 2d/index.html -o 2d/index.pending.html;
            mv 2d/index.pending.html 2d/index.html;
            put index.html -o index.pending.html;
            mv index.pending.html index.html;
            get index.html -o /tmp/futurehawzah-home.html;
            get 2d/index.html -o /tmp/futurehawzah-2d.html;
            get 3d/index.html -o /tmp/futurehawzah-3d.html;
            bye
          "
          cmp index.html /tmp/futurehawzah-home.html
          cmp 2d/index.html /tmp/futurehawzah-2d.html
          cmp 3d/index.html /tmp/futurehawzah-3d.html
      - name: Verify public pages and original PDF bytes
        run: |
          set -euo pipefail
          for file in index.html 2d/index.html 2d/t/index.html 2d/t/06/index.html 2d/t/07/index.html 2d/t/08/index.html 2d/t/09/index.html 3d/index.html 3d/t/index.html; do
            curl -fsSL --retry 3 --max-time 45 "https://futurehawzah.ir/${file%index.html}?deploy=$GITHUB_SHA" -o /tmp/futurehawzah-live.html
            cmp "$file" /tmp/futurehawzah-live.html
          done
          curl -fsSL --retry 3 --max-time 45 "https://futurehawzah.ir/3d/t/18/?deploy=$GITHUB_SHA" -o /tmp/futurehawzah-live-18.html
          cmp _release/3d-tests/18/index.html /tmp/futurehawzah-live-18.html
          mkdir -p _release/public
          for file in _release/downloads/*.pdf; do
            name="${file##*/}"
            curl -fsSL --retry 3 --max-time 85 "https://futurehawzah.ir/downloads/exhibition/$name?deploy=$GITHUB_SHA" -o "_release/public/$name"
          done
          python3 deployment/prepare-exhibition.py --verify _release/public
